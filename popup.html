<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <title>Argo DidUP Booster</title>
</head>
<body>
  <header class="hdr">
    <img src="icon/icon128.png" class="hdr-logo" alt="">
    <div class="hdr-title">
      <strong>Argo DidUP Booster</strong>
      <span id="hdr-sub">Registro elettronico</span>
    </div>
    <button id="open-settings" class="icon-btn" title="Impostazioni" aria-label="Impostazioni">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div id="missing-code" class="notice notice-error" hidden>
    <strong>Codice scuola non impostato</strong>
    <span>Impostalo nelle impostazioni per usare l'accesso automatico.</span>
    <button id="missing-code-btn" class="btn btn-danger">Apri impostazioni</button>
  </div>

  <!-- Registro aperto -->
  <main id="view-registro" class="view" hidden>
    <div class="tiles">
      <button id="btn-firma" class="tile">
        <span class="tile-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </span>
        <strong>Firma ora</strong>
        <small>La lezione in corso o la prossima</small>
      </button>
      <button id="btn-appello" class="tile">
        <span class="tile-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </span>
        <strong>Appello</strong>
        <small>Della lezione più vicina all'ora</small>
      </button>
    </div>
    <div id="session" class="session">
      <span class="dot" aria-hidden="true"></span>
      <span id="session-text">Sessione</span>
      <button id="btn-relogin" class="session-btn" hidden>Accedi di nuovo</button>
    </div>
    <section id="run" class="run" hidden aria-live="polite">
      <div class="run-head">
        <span class="run-icon" aria-hidden="true"></span>
        <strong id="run-title"></strong>
      </div>
      <ol id="run-steps" class="run-steps"></ol>
      <div id="run-ask" class="run-ask" hidden>
        <p id="run-ask-text"></p>
        <div class="run-ask-btns">
          <button id="run-ask-yes" class="btn btn-primary">Sì</button>
          <button id="run-ask-no" class="btn btn-ghost">No</button>
        </div>
      </div>
      <p id="run-result" class="run-result"></p>
    </section>
  </main>

  <!-- Pagine di accesso di Argo -->
  <main id="view-login" class="view" hidden>
    <dl class="facts">
      <div><dt>Codice scuola</dt><dd id="login-code">—</dd></div>
      <div><dt>Accesso con</dt><dd id="login-method">—</dd></div>
    </dl>
    <button id="btn-login" class="btn btn-primary btn-block">Accedi ora</button>
    <p id="login-hint" class="hint"></p>
  </main>

  <!-- Fuori da Argo -->
  <main id="view-out" class="view" hidden>
    <button id="btn-go" class="btn btn-primary btn-block">Apri il registro</button>
    <p id="out-hint" class="hint"></p>
  </main>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
